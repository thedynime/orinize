<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" fill="none">
<style>
@keyframes orinizeBlink { 0%, 94%, 98%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
.orinize-eyes-animated { transform-origin: 16px 16px; animation: orinizeBlink 4.2s infinite ease-in-out; }
@media (prefers-reduced-motion: reduce) { .orinize-eyes-animated { animation: none; } }
</style>
  <defs>
    <!-- 3D Spherical Volume Gradient -->
    <radialGradient id="orinizeSphereVolume" cx="32%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#93A6FF" />
      <stop offset="20%" stop-color="#6E82FF" />
      <stop offset="50%" stop-color="#5164FF" />
      <stop offset="78%" stop-color="#3748E6" />
      <stop offset="100%" stop-color="#2432BD" />
    </radialGradient>

    <!-- Top Gloss Glint -->
    <radialGradient id="orinizeTopGlint" cx="45%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </radialGradient>

    <!-- Bottom Rim Bounce Light -->
    <radialGradient id="orinizeBottomBounce" cx="50%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#8093FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8093FF" stop-opacity="0.0" />
    </radialGradient>

    <clipPath id="orinizeSphereClip">
      <circle cx="16" cy="16" r="16" />
    </clipPath>
  </defs>

  <!-- 3D Spherical Body -->
  <g clip-path="url(#orinizeSphereClip)">
    <circle cx="16" cy="16" r="16" fill="url(#orinizeSphereVolume)" />
    <ellipse cx="15" cy="8.5" rx="10.5" ry="6" fill="url(#orinizeTopGlint)" transform="rotate(-18 15 8.5)" />
    <ellipse cx="16" cy="30" rx="12" ry="5" fill="url(#orinizeBottomBounce)" />
  </g>

  <!-- Crisp White Pill Eyes -->
  <g class="orinize-eyes-animated">
    <rect x="9.5" y="10.5" width="4.2" height="11" rx="2.1" fill="#FFFFFF" />
    <rect x="18.3" y="10.5" width="4.2" height="11" rx="2.1" fill="#FFFFFF" />
  </g>
</svg>